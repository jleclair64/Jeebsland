; Texture size caps for Windows (the packaged game and, through WindowsEditor, the editor). 2026-11-16, roads agent.
; The Fab tree and grass packs (Content/DZ_Assets, PN_interactiveSpruceForest, PN_GrassLibrary, PN_MeadowFlowers, PN_OpenWorldFoliage;
; junction-linked, never saved by us) ship textures up to 8192 in the World and WorldNormalMap groups. Capping those two groups at 4096
; drops their top mip when cooking (about 600 MB less texture data before compression) and eases the streaming pool. 4096 is
; our own largest (the TownLab buildings and the church), so none of ours shrinks. A 2048 cap (the owner's target, about 1.6 GB less)
; would also halve those 27 building textures; it needs them moved to their own group first (see Docs/ProjectNotes.md, "Texture caps").
; The list is the engine's GlobalDefaults (BaseDeviceProfiles.ini) in full, so no other group changes; only the two MaxLODSize differ.
[Windows DeviceProfile]
!TextureLODGroups=ClearArray
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldSpecular,MinLODSize=1,MaxLODSize=16384,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
