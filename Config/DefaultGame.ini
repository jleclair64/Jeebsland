[Jeebsland.Testing]
; Accounts that get every skill at level 99 when they log in (testing gear). Remove a line to turn it off.
+MaxLevelAccounts=randy
; Editor Play on this PC (single player or the editor's Tester accounts) also gets every skill at 99 while this is True.
MaxLevelInEditor=True
; Arrows are never used up and everyone is kept at 99 steel and 99 fire arrows while this is True (testing the bow).
UnlimitedArrows=True
; Every login starts on Oak Hill's plaza, wherever the character logged out, while this is True (testing the town; owner 2026-11-12). New characters and deaths start there anyway.
StartAtOakHill=True
; TEMPORARY: trees, rocks and all other resource nodes still give their yield but never lose charges, vanish or respawn while this is True.
UnlimitedNodes=True
; (to study a move: SwingSpeed=0.2 plays sword swings 80% slower)
