; ============================================================================================================
; JEEBSLAND TUNING NUMBERS
; How fast, how far, how strong and how long things are. Change a number and SAVE: while the game is running
; (editor Play or a test game) it is picked up within half a second, and the next jump, swing or arrow uses it.
; No build, no restart.
;
; - Format: Name = number. Anything after ; is a note. Keep the [Section] lines and the names as they are.
; - A misspelled name, a missing line or something that is not a number is written to the log
;   (Saved/Logs/Jeebsland.log, "Jeebsland tuning:") and that number keeps its built-in value.
; - Units: cm (100 = 1 m), seconds, cm/s for speeds, cm/s/s for drop and braking. "x" numbers are multipliers.
; - Online: the world servers read their own copy. Movement numbers (speeds, jump, dash) must be the same on players'
;   machines, so after changing them, repackage and send friends the new zip.
; - Item numbers (damage, armour and shield tiers, prices) are in the CSV files next to this one.
; ============================================================================================================

[Movement]
WalkSpeed = 500          ; normal running speed (cm/s). 500 = 5 m/s
SprintSpeed = 750        ; sprint speed (cm/s)
CrouchSpeed = 240        ; crouching speed (cm/s)
WalkAccel = 30000        ; how fast he gets up to walking speed (huge = instant)
SprintAccel = 2048       ; how fast he speeds up from walking to sprinting
JumpHeight = 75          ; full jump, Space held (cm)
HopShare = 0.34          ; short hop (Space let go quickly) as a share of the full jump. 0.34 of 75 = about 25 cm
HopHold = 0.1            ; he leaves the ground at once. Space let go within this many seconds: the short hop
FullJumpHold = 0.16      ; ...held this long: the full jump. Let go in between: a height in between, in step with the hold. Shorter = a quicker, less floaty push
Weight = 1.6             ; how heavy he falls: x real gravity. Higher = he rises and drops faster (jump heights stay the same), so less floaty; falls off ledges are faster too

[Bow]
BowDrawTime = 0.85       ; seconds to a full draw
BowHoldMax = 2           ; seconds a full draw can be held before it lets go by itself
BowRecover = 0.3         ; seconds after a shot before the next draw
BowSpeedMin = 1150       ; arrow speed with almost no draw (cm/s)
BowSpeedMid = 2760       ; arrow speed at half a draw
BowSpeedMax = 5520       ; arrow speed at a full draw
BowSagMin = 2900         ; how fast an arrow drops with almost no draw (cm/s/s; 980 = real gravity)
BowSagMid = 1000         ; how fast it drops at half a draw
BowSagMax = 980          ; how fast it drops just short of a full draw
BowStraight = 1          ; a FULL draw flies dead straight this far before it starts to drop (cm). 1 = it drops from the moment it leaves the bow
BowSagFull = 980         ; how fast a full draw drops after its straight part
BowDamageMin = 0.12      ; x the bow's damage with almost no draw
BowDamageMax = 1.3       ; x the bow's damage at a full draw (in between grows with the draw to the power 1.5)
BowCamLength = 220       ; camera distance while aiming (cm; 540 normally)
HeadshotMul = 1.5        ; x damage for arrows and bolts that hit the head (before the helmet)

[Jab]
SwordJabDamage = 0.75    ; x a sword's damage for each jab hit
Jab1From = 0.30          ; hit 1 can land from this share of its swing...
Jab1To = 0.80            ; ...to this share
Jab2From = 0.36          ; hit 2, the same
Jab2To = 0.74
StunJab1 = 0.45          ; seconds of hitstun from hit 1 (long enough that hit 2 always connects)
StunJab2 = 0.32          ; seconds of hitstun from hit 2
PushJab1 = 120           ; how hard hit 1 pushes him back (cm/s)
PushJab2 = 320           ; how hard hit 2 pushes him back

[Smash]
SwordSmashDamage = 1     ; x a sword's damage, uncharged
SwordSmashFullMul = 2.5  ; x that again at a full charge
SmashHoldDelay = 0.25    ; seconds the button must be held before a jab turns into a smash
SmashChargeTime = 1      ; seconds to a full charge
SmashHoldMax = 2         ; seconds a full charge can be held before it goes by itself
SmashEndPause = 0.4      ; seconds he is stuck at the end of the swing (end lag)
StunSmash = 0.5          ; seconds of hitstun, uncharged...
StunSmashFull = 0.8      ; ...and fully charged
PushSmash = 300          ; push back, uncharged (cm/s)...
PushSmashFull = 700      ; ...and fully charged
ReboundJab = 0.3         ; seconds stuck after a jab bounces off a shield
ReboundSmash = 0.6       ; seconds stuck after a smash bounces off a shield

[Kick]
KickDur = 0.65           ; seconds the whole kick takes
KickActiveFrom = 0.18    ; it can land from this share of the kick...
KickActiveTo = 0.5       ; ...to this share
KickDamage = 0.6         ; x a sword's damage
KickLandedSpeed = 2.2    ; a kick that lands finishes this many times faster (less end lag)

[Sweep]
SweepDur = 0.55          ; seconds the whole low sweep takes
SweepActiveFrom = 0.24   ; it can land from this share of the sweep...
SweepActiveTo = 0.6      ; ...to this share
SweepDamage = 0.8        ; x a sword's damage

[Dash]
DashLunge = 1100         ; speed of the lunge (cm/s)
DashActiveFrom = 0.11    ; seconds in when the stab can start to land...
DashActiveTo = 0.28      ; ...and stops landing
DashCharge = 0.2         ; it hits like a smash charged this much (0 = uncharged, 1 = full)
DashSlideBrake = 4500    ; how hard the ground brakes the lunge (cm/s/s). Lower = a longer slide

[Knockdown]
KnockFall = 0.35         ; seconds to fall flat after a kick or a sweep
KnockAuto = 1.5          ; seconds lying down before he gets up by himself
KnockRise = 0.45         ; seconds to stand back up

[Guard]
GuardAtLevel1 = 20       ; the guard bar at Defence level 1...
GuardAtLevel99 = 40      ; ...and at level 99 (in between grows evenly)
GuardDrainSeconds = 15   ; holding the shield up empties a full guard in this many seconds

[Armour]
MinTake = 0.5            ; the least of a blow that always gets through, even the best armour with rings. 0.5 = half

[Weight]
; Each armour piece weighs its Weight in Kinds.csv x its tier's WeightMult in Tiers.csv (a full steel suit is 21 kg).
FreeWeight = 18           ; kg of armour he wears without slowing down (a full tin or silver suit is under this)
SlowPerKg = 0.01          ; for each kg over that, this share slower walking, sprinting and crouching. 0.01 = 1% per kg
MaxSlow = 0.3             ; never more than this much slower. 0.3 = 30%
