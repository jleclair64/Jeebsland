; camera looks, Shift swims fast (for more of the bar), Ctrl held dives, Space held (under water) comes up faster. Weapon and shield go on his back.
; Swimming stamina: a bar that lasts this many seconds of normal swimming, by Swimming level, straight lines between. Run it out and he drowns.
SwimAt1 = 40
SwimAt10 = 70
SwimAt30 = 100
SwimAt99 = 180
SwimIdleShare = 0.25      ; treading water still drains this share of the swimming pace
SwimFastShare = 3         ; swimming fast (Shift) drains this many times the pace
SwimSpeed = 340           ; cm/s swimming (owner 2026-11-14: twice the old 170; the stroke plays 1.5x faster, so it covers 320 cm a stroke, KnightMoves.csv Swim)
SwimFastSpeed = 540       ; cm/s with Shift held (twice the old 270)
SwimAccel = 900           ; cm/s/s he speeds up and glides to a stop in the water
DiveSpeed = 150           ; cm/s down while Ctrl is held
SwimRiseSpeed = 220       ; cm/s up under water while Space is held
SwimFloatSpeed = 130      ; cm/s he floats back up to the surface on his own
SwimFloat = 50            ; cm his middle sits under the surface while he floats (head and shoulders out)
SwimSink = 26             ; cm the swimming pose sits lower in the water (owner 2026-11-14: the hands flush with the surface at the top of the stroke)
CamOverGrass = 105        ; cm the camera stays over the ground (above the grass: looking up from low down shows sky, not blades); 0 = off; not inside a house
CamOverWater = 15         ; cm the camera always stays over the water surface (it never goes under)
SwimEnterDepth = 100      ; cm of water at his feet where walking turns into swimming (owner 2026-11-14: once the water is over his waist)
SwimExitDepth = 85        ; cm of water where he can stand again and walks out (lower than the above, so he never flickers between the two)
WadeSlow = 0.45           ; walking through water is this share slower at the deepest (chest deep), less in shallower water
; Breath: how long he can stay with his head under water, by Swimming level (straight line between). Run it out and he drowns.
BreathAt1 = 10
BreathAt99 = 25
BreathRefillPerSec = 0.5  ; share of the breath that comes back each second with his head out of the water
SwimRefillDelay = 0.5     ; seconds on dry ground before the swimming bar starts to refill (it never refills in the water)
SwimRefillPerSec = 0.25   ; share of the bar it refills each second on the ground
DrownSinkTime = 1.5       ; seconds he sinks, drowning, before he dies (and wakes in Oak Hill, his things in a sack on the nearest shore)
DrownSinkSpeed = 60       ; cm/s he sinks while drowning
SwimXPPerMetre = 1        ; Swimming XP for each metre swum
SwimXPLump = 50           ; on a long swim the XP comes every this many metres (the rest when he leaves the water), so the skill pop-up shows now and then, not every metre

[Travel]
TravelChannel = 3         ; seconds he stands still before a fast travel jumps (moving, attacking or being hit cancels it)
TravelCombat = 10         ; seconds after the last blow dealt or taken before he can start a fast travel
TravelCooldown = 30       ; seconds after a fast travel before the next one

