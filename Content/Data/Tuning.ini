; ============================================================================================================
; JEEBSLAND TUNING NUMBERS
; How fast, how far, how strong and how long things are. Change a number and SAVE: while the game is running
; (editor Play or a test game) it is picked up within half a second, and the next jump, swing or arrow uses it.
; No build, no restart.
;
; - Format: Name = number. Anything after ; is a note. Keep the [Section] lines and the names as they are.
; - A misspelled name, a missing line or something that is not a number is written to the log
;   (Saved/Logs/Jeebsland.log, "Jeebsland tuning:") and that number keeps its built-in value.
; - Units: cm (100 = 1 m), seconds, cm/s for speeds, cm/s/s for drop and braking. "x" numbers are multipliers.
; - Online: the world servers read their own copy. Movement numbers (speeds, jump, dash) must be the same on players'
;   machines, so after changing them, repackage and send friends the new zip.
; - Item numbers (damage, armour and shield tiers, prices) are in the CSV files next to this one.
; ============================================================================================================

[Movement]
WalkSpeed = 500          ; normal running speed (cm/s). 500 = 5 m/s
SprintSpeed = 733.1      ; sprint speed (cm/s) (owner, 2026-11-15: +15%, was 637.5; before that 2026-11-07: 15% slower)
CrouchSpeed = 240        ; crouching speed (cm/s)
WalkAccel = 30000        ; how fast he gets up to walking speed (huge = instant)
SprintAccel = 2048       ; how fast he speeds up from walking to sprinting
SprintRestartShare = 0.2  ; every character (owner 2026-11-22): after running the stamina bar dry, sprint again once this share of it is back (not before a fifth: below that it flickers between sprint and walk); the sprint lasts as long as what is in the bar
KnightGravity = 2        ; how many times real gravity pulls the knight (owner, 2026-11-15: heavier, like the arrows; was 1). Jumps stay about 90 cm high, just quicker up and down

[Agility]
AgilitySprintAt1 = 8        ; (2026-11-23, knight and wizard only) seconds of sprinting a full running-stamina bar lasts at Agility level 1
AgilitySprintAt99 = 30      ; ... and at level 99 (in between: a straight line). Rolls, slides and teleports still cost about 1 second of it each
AgilityRefillAt1 = 12       ; seconds for an empty bar to fill again when not sprinting, at level 1 (boots still speed it up)
AgilityRefillAt99 = 4       ; ... at level 99
AgilityRegenDelay = 1       ; seconds after sprinting stops before the bar starts to fill
AgilityXPPerSec = 1         ; Agility XP for each second of sprinting (the server gives it in lumps of 5)

[Bow]
BowDrawTime = 0.85       ; only the longbow's yardstick now: its draw is LongDrawTime / this x the bow's (the bow's own draw is [Archery] below)
BowRecover = 0.3         ; seconds after a shot before the next draw
BowSpeedMin = 1150       ; arrow speed with almost no draw (cm/s)
BowSpeedMid = 2760       ; arrow speed at half a draw
BowSpeedMax = 5520       ; arrow speed at a full draw
BowSagMin = 2900         ; how fast an arrow drops with almost no draw (cm/s/s; 980 = real gravity)
BowSagMid = 1000         ; how fast it drops at half a draw
BowSagMax = 980          ; how fast it drops just short of a full draw
BowStraight = 1          ; a FULL draw flies dead straight this far before it starts to drop (cm). 1 = it drops from the moment it leaves the bow
BowSagFull = 980         ; how fast a full draw drops after its straight part
BowDamageMin = 0.12      ; x the bow's damage with almost no draw
BowDamageMax = 1.3       ; x the bow's damage at a full draw (in between grows with the draw to the power 1.5)
BowCamLength = 220       ; camera distance while aiming (cm; 540 normally)
HeadshotMul = 1.5        ; x damage for arrows and bolts that hit the head (before the helmet)

[Jab]
Jab1Share = 0.49          ; the first swing lasts this share of the weapon's cooldown (owner, 2026-11-06: 30% quicker again)
Jab2Share = 0.65          ; the second swing, the same (owner, 2026-11-11: its cut as quick as the first's; was 0.847)
Jab1Pause = 0.2           ; after the first swing he holds still this share of the cooldown before the second can start (Ocarina of Time: fast, a brief pause...)
Jab2Pause = 0.28          ; ...and after the second a little longer, before a new first swing can come out. The server keeps to both.
SwordJabDamage = 0.75    ; x a sword's damage for each jab hit
Jab1From = 0.30          ; hit 1 can land from this share of its swing...
Jab1To = 0.80            ; ...to this share
Jab2From = 0.36          ; hit 2, the same
Jab2To = 0.74
StunJab1 = 0.45          ; seconds of hitstun from hit 1 (long enough that hit 2 always connects)
StunJab2 = 0.32          ; seconds of hitstun from hit 2
PushJab1 = 120           ; how hard hit 1 pushes him back (cm/s)
PushJab2 = 320           ; how hard hit 2 pushes him back

[Smash]
SwordSmashDamage = 1     ; x a sword's damage, uncharged
SwordSmashFullMul = 2.5  ; x that again at a full charge
SmashHoldDelay = 0.25    ; seconds the button must be held before a jab turns into a smash
SmashChargeTime = 1      ; seconds to a full charge
SmashHoldMax = 2         ; seconds a full charge can be held before it goes by itself
SmashEndPause = 0.4      ; seconds he is stuck at the end of the swing (end lag)
StunSmash = 0.5          ; seconds of hitstun, uncharged...
StunSmashFull = 0.8      ; ...and fully charged
PushSmash = 300          ; push back, uncharged (cm/s)...
PushSmashFull = 700      ; ...and fully charged
ReboundJab = 0.405       ; seconds stuck after a jab bounces off a shield (0.3 x 1.35, owner 2026-11-06)
ReboundSmash = 0.81      ; seconds stuck after a smash (or dash) bounces off a shield (0.6 x 1.35)

[Kick]
KickDur = 0.65           ; seconds the whole kick takes
KickActiveFrom = 0.18    ; it can land from this share of the kick...
KickActiveTo = 0.5       ; ...to this share
KickDamage = 0.6         ; x a sword's damage
KickLandedSpeed = 2.2    ; a kick that lands finishes this many times faster (less end lag)

[Sweep]
SweepDur = 0.55          ; seconds the whole low sweep takes
SweepActiveFrom = 0.24   ; it can land from this share of the sweep...
SweepActiveTo = 0.6      ; ...to this share
SweepTrailFrom = 0.36    ; the white trail starts here (share of the sweep, later than SweepActiveFrom: the floor-skimming start has no trail; the hit window is not touched)
SweepDamage = 0.8        ; x a sword's damage

[Dash]
DashLunge = 1100         ; speed of the lunge (cm/s)
DashActiveFrom = 0.11    ; seconds in when the stab can start to land...
DashActiveTo = 0.28      ; ...and stops landing
DashCharge = 0.2         ; it hits like a smash charged this much (0 = uncharged, 1 = full)
DashSlideBrake = 4500    ; how hard the ground brakes the lunge (cm/s/s). Lower = a longer slide

[Knockdown]
KnockFall = 0.35         ; seconds to fall flat after a kick or a sweep
KnockAuto = 1.5          ; seconds lying down before he gets up by himself
KnockRise = 0.45         ; seconds to stand back up

[Guard]
; A shield has health (owner, 2026-11-06): Tiers.csv ShieldHealth x ShieldStyles.csv GuardMul. A gold kite shield has 200. A blow on it costs its damage, one for one.
ShieldDrainPerSecond = 25    ; holding the shield up costs this much health a second, for every shield
ShieldHealAtLevel1 = 15      ; health a second it heals at Defence level 1, lowered, once its RecoverDelay is over (ShieldStyles.csv)...
ShieldHealAtLevel99 = 60     ; ...and at level 99 (in between grows evenly; level 23 is about 25). x the style's HealMul.

[Armour]
MinTake = 0.5            ; the least of a blow that always gets through, even the best armour with rings. 0.5 = half

[Weight]
; Each armour piece weighs its Weight in Kinds.csv x its tier's WeightMult in Tiers.csv (a full suit of a material with WeightMult 1 is 21 kg).
FreeWeight = 23           ; kg of armour and shield he carries without slowing down (a full tin suit and a tin kite shield are under this; shields weigh something since 2026-11-06)
SlowPerKg = 0.01          ; for each kg over that, this share slower walking, sprinting and crouching. 0.01 = 1% per kg
MaxSlow = 0.3             ; never more than this much slower. 0.3 = 30%

[Longbow]
; (its damage is in Kinds.csv; the rest of the arc is the bow's. All three bows come to about the same damage per second: slower means a bigger single hit.)
LongDrawTime = 1.25      ; seconds to a full draw (the bow's is BowDrawTime)
LongSpeed = 6800         ; arrow speed at a full draw; lesser draws scale with it
LongWalk = 0.4           ; x walking speed while drawing (the bow: 0.5)

[Crossbow]
; (its damage is in Kinds.csv. It is never partly drawn: every shot is at full power, and it can stay ready for as long as you like)
CrossRaise = 0.001       ; seconds to bring it up before it can shoot (owner, 2026-11-06: none, it fires as soon as the button is let go)
CrossSpeed = 8300        ; arrow speed
CrossSag = 700           ; how fast its arrow drops (980 = real gravity): the flattest and furthest of the three
CrossReload = 2.1        ; seconds to load it again after a shot; a roll or a weapon change only pauses this
CrossReloadWalk = 0.5    ; x walking speed while loading
CrossAimWalk = 0.7       ; x walking speed while it is up
CrossGuardMul = 1        ; UNUSED since 2026-11-12: arrows and bolts do no shield damage (owner)

[Gather]
GatherSwings = 10         ; one click on a tree or rock goes on for about this many swings, unless he moves off (owner, 2026-11-06)

[Fishing]
; (2026-11-26, the fishing redo: Docs/FishingPlan.md) The server picks how long until a bite: evenly between FishBiteMin and the longest wait at your level
; (FishBiteMaxAt1 at Fishing 1, FishBiteMaxAt99 at 99, straight between), x the pole's speed. Then you have FishReelWindow seconds to click.
FishBiteMin = 6           ; seconds, the soonest a fish can bite
FishBiteMaxAt1 = 32       ; seconds, the longest wait at Fishing 1 (mean about 19 s)
FishBiteMaxAt99 = 12      ; seconds, the longest wait at Fishing 99 (mean about 9 s)
FishReelWindow = 0.5      ; seconds to click once the float goes under (online the server adds your ping, at most FishPingAllowance)
FishPingAllowance = 0.3   ; seconds of extra time at most for the round trip online

[Potion]
; Drinking takes time: no attacking, guarding or drawing meanwhile, and a blow or a roll stops it with the potion kept. The potion works when it's finished.
DrinkTime = 1.8           ; seconds from raising the bottle to the potion working
DrinkWalk = 0.5           ; how fast he can walk meanwhile, as a share of his walking speed

[Archery]
; The bow's draw speed by Archery level (owner, 2026-11-12): seconds to a full draw at these levels, straight lines between them. The longbow is the same x LongDrawTime / BowDrawTime.
DrawAt1 = 2.0
DrawAt10 = 1.0
DrawAt30 = 0.7
DrawAt99 = 0.2
; Accuracy by Archery level (2026-11-26, owner: the level softly helps any arrow): a shot strays up to SpreadAt1 degrees at level 1, less each level, none from SpreadGoneAt.
; A full draw strays half as much. Any arrow: the arrow itself never changes it.
SpreadAt1 = 1.2
SpreadGoneAt = 60

[Climb]
; Free climbing, Breath of the Wild style (2026-11-12): walk or jump into a hill or rock too steep to walk up and he grabs on. W/S/A/D move on the
; wall, Space is a climb jump, Ctrl lets go. Only hills and rock (ground and rocks marked for it), never buildings, trees, fences or walls.
; Climbing stamina: a bar that lasts this many seconds of climbing UP while moving, by Climbing level, straight lines between (more at the low levels):
ClimbAt1 = 5
ClimbAt10 = 17.5
ClimbAt30 = 23
ClimbAt99 = 30
ClimbHangShare = 0.2      ; hanging still drains this share of the climbing-up pace
ClimbSideShare = 0.667    ; straight sideways drains this share (a diagonal mixes up, sideways and down by how much of each it has)
ClimbDownShare = 0.5      ; straight down drains this share
ClimbUpSpeed = 80         ; cm/s up the wall (the clip climbs 111 cm in 2 s: 56 cm/s; faster than 1.4x that and the hands skate)
ClimbSideSpeed = 60       ; cm/s sideways (the clip: 45)
ClimbDownSpeed = 75       ; cm/s down (the clip: 56)
ClimbJumpCost = 0.2       ; share of the bar a climb jump (Space on the wall) takes; with less than this left, Space does nothing
ClimbJumpDist = 100       ; cm the climb jump carries him along the wall, the way the keys point (no key: up)
ClimbJumpTime = 0.6       ; seconds the climb jump takes, from the crouch on the wall to the catch
ClimbUpTime = 1.1         ; seconds to pull up over the top onto his feet
ClimbRefillDelay = 0.4    ; seconds on the ground before the bar starts to refill
ClimbRefillPerSec = 0.35  ; share of the bar it refills each second on the ground. Run it right out and it must refill completely before he can grab again
ClimbXPPerMetre = 4       ; Climbing XP for each metre of NEW height gained on a wall (climbing down and up again gives nothing)
; The mantle, Fortnite style: walking, running or jumping into a low obstacle vaults over it or climbs onto it by itself (owner 2026-11-13: automatic; Space by one does it too, holding Ctrl stops it). No stamina, no skill.
; What counts (owner 2026-11-16): any solid he can't walk through whose top is MantleMin..MantleMax above his feet, judged from its own collision: fences, low walls,
; crates and stacks, barrels, hay, logs, stumps, rocks, benches, tables, the pig pen fence. Never people or animals, moving things, climbable rock, posts and poles,
; or anything taller (buildings, trees, palisades). A component or actor tagged JeebNoMantle is left out.
MantleOverTime = 0.65     ; seconds to vault over a fence
MantleOntoTime = 0.6      ; seconds to climb onto a block or low wall
MantleStandTime = 0.25    ; seconds he stands still on top after the ledge pull-up or a climb onto, rising to his feet before he walks on (not after a vault)
MantleMin = 60            ; cm: the lowest top (above his feet) he mantles; lower ones a plain jump clears (it lifts his feet about 90 cm), and under 45 he just steps up (was 50)
MantleMax = 145           ; cm: the highest, about his chest (was 150)
MantleMinWidth = 40       ; cm: an object narrower than this every way (a post, a pole, a sign) is never mantled: there's nothing to vault or stand on
MantleAuto = 0.01                  ; 0: a mantle needs Space (pressed by the ledge, or held while walking into it or in the air; owner 2026-11-22); 1: walking or running into one mantles by itself
MantleCarry = 0.6         ; share of his running speed he keeps when he lands a vault

[Swim]
