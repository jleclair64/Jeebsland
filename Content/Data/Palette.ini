; Jeebsland's world palette (2026-11-15): the one place the world's colours live. Docs/Palette.md explains every line.
;
; Two parts:
;   [Knobs]    move the whole world together (season and mood). 0 is today's look. Live in Play with the console:
;              jeeb.Palette.Autumn 0.5   (also Warmth, Greenness, Saturation, Brightness; jeeb.Palette.Reload re-reads this file)
;   [Colours]  the named base colours the world's materials and code read. Name = R, G, B, class (linear colour, as Unreal's).
;              Changing one: edit it here, then jeeb.Palette.Reload in Play (colours set by code and the palette collection's
;              values change at once; the material builders also take their defaults from here, so rebuild them before committing:
;              Tools\BuildMaterials.ps1, BuildWorldMaterial.ps1, BuildTownLab.ps1).
;
; Classes say how the knobs touch a colour: plant (grass, leaves, bushes: every knob, the season most), evergreen (pine and
; redwood needles: a quarter of the season), world (earth, stone, bark: warmth, saturation, brightness), sky (haze, water:
; warmth and saturation only), none (physical numbers such as the water's absorption: never changed).

[Knobs]
; -1..1 each (clamped). +1 is the strongest sensible step; try 0.2-0.5 first.
Autumn=0        ; + greens turn gold-orange (grass, leaves; pines a quarter), - warm leaves and dry grass turn green (summer)
Warmth=0        ; + every surface warmer (red up, blue down, same brightness), - cooler
Greenness=0     ; + plants lusher green, - drier and greyer-olive (plants only)
Saturation=0    ; + every world colour richer, - greyer (up to +-50%)
Brightness=0    ; + every surface lighter (up to +-25%; the haze and water keep theirs: the exposure handles the light)

[Grade]
; How strong each knob is at 1 (advanced: these set what the knobs mean, not today's look).
WarmthGain=0.12, 0.02, -0.18    ; R, G, B gain at Warmth 1 (then rescaled so the brightness stays)
GreenGain=-0.10, 0.15, -0.10    ; R, G, B gain at Greenness 1 (rescaled the same way)
SaturationRange=0.5             ; Saturation 1 = 1.5x the colour, -1 = 0.5x
BrightnessRange=0.25            ; Brightness 1 = 1.25x
AutumnTint=1.55, 0.93, 0.30     ; the hue greens move to at Autumn 1 (a warm gold; its brightness is taken from each colour)
SummerTint=0.62, 1.20, 0.42     ; the hue warm plant colours move to at Autumn -1 (a fresh green)
EvergreenShare=0.25             ; how much of the season pines and redwoods take

[Colours]
; --- the field: our grass cards, the realistic grass, the ground's grass, the shared field recipe (Tools/grass_field.py)
GrassBlade=0.52, 0.46, 0.33, plant        ; M_Grass: the painted blades' tint
GrassStem=0.075, 0.085, 0.022, plant      ; M_GrassFlower: the small flowers' stems
Bush=0.66, 0.66, 0.38, plant              ; M_Bush: the shrubs along the walls
GrassPack1=1.01, 0.83, 1.0, plant          ; the realistic Grass Library blades' tint (Meadow.cpp; jeeb.Grass.Tint1 still overrides)
GrassPack2=0.86, 0.9, 0.8, plant          ; Open World Foliage blades' tint (jeeb.Grass.Tint2 overrides)
FieldHollow=0.72, 0.95, 0.80, plant       ; the field's 45 m patches: deeper green hollows ...
FieldSunny=1.17, 1.09, 0.74, plant        ; ... to sunny yellow-green swathes (both multipliers)
FieldDry=1.45, 1.05, 0.55, plant          ; the warm dry patches, about 30 m across (multiplier)
GroundGrass=1.139, 0.759, 0.358, plant    ; M_Ground and Oak Hill's lawn: the painted grass picture times this meets the blades
; --- earth and stone
Earth=2.02, 2.79, 3.95, world             ; packed earth: the dirt picture times this averages a light tan (roads, worn ground)
Sand=0.40, 0.33, 0.21, world              ; the beach
Snow=0.82, 0.85, 0.90, world              ; high ground (off until the mountains)
RockFar=0.100, 0.096, 0.084, world        ; what the hillside stone fades to far away
Cobble=0.92, 1.00, 1.12, world            ; Oak Hill's flagstones: the picture times this (a warm grey)
Moss=0.07, 0.11, 0.035, plant             ; moss on the foundation stones' tops (M_Stone)
; --- trees (Forest.cpp, AutumnDecor.cpp's fallen leaves)
LeafOrange=0.50, 0.17, 0.045, plant       ; burnt orange
LeafRed=0.36, 0.07, 0.045, plant          ; deep red
LeafAmber=0.55, 0.33, 0.07, plant         ; amber
LeafGold=0.42, 0.27, 0.07, plant          ; gold-brown
LeafGreen=0.17, 0.22, 0.07, plant         ; the last green holdout
Needle=0.10, 0.26, 0.12, evergreen        ; pine needles
NeedleLight=0.13, 0.31, 0.14, evergreen   ; pine needles, lighter
NeedleRedwood=0.10, 0.27, 0.19, evergreen ; redwood needles, bluer
Bark=0.20, 0.13, 0.07, world              ; brown
BarkWarm=0.26, 0.17, 0.10, world          ; warm brown
BarkGrey=0.21, 0.155, 0.11, world         ; grey-brown
BarkRed=0.26, 0.14, 0.07, world           ; reddish
BarkRedwood=0.30, 0.13, 0.07, world       ; redwood trunks (plated bark)
; --- water (WaterLook.cpp; the jeeb.Water.* console variables still override)
WaterScatter=0.0045, 0.0052, 0.0056, sky  ; the water's body colour (scattering per cm: slate at noon)
WaterAbsorb=0.024, 0.017, 0.014, none     ; how fast light is swallowed, per cm (dark natural slate, not blue)
WaterBehind=0.95, 1.0, 0.88, sky          ; what is seen through the water (a touch green-brown riverbed)
WaterFoam=0.62, 0.67, 0.68, sky           ; the shore foam (greyish, not white)
WaterGlow=0, 0, 0, sky                    ; the water's own faint slate light at noon
WaterGlowDusk=0.0077, 0.0125, 0.0163, sky   ; the same at the low sun
; --- sky (DayNight.cpp)
HazeNoon=0.54, 0.58, 0.66, sky            ; the height fog at noon: soft blue-grey
HazeLow=0.60, 0.46, 0.40, sky             ; the height fog at the low sun: warm peach-lilac
